# whisper-desk configuration — ~/.config/whisper-desk/config.toml
# After a change: whisper-desk reload

[hotkey]
# GTK syntax: <Super>, <Ctrl>, <Alt>, <Shift>. E.g. "<Super><Shift>d", "<Ctrl><Alt>space".
# "auto": <Super>j — but <Ctrl><Alt>j under WSL, since Windows reserves the
# Windows key for itself and only accepts global shortcuts based on Ctrl+Alt.
binding = "auto"
name = "whisper-desk"
# To apply a shortcut change: whisper-desk hotkey install — whisper-desk settings does it for you
action = "toggle"

[model]
# "auto": large-v3-turbo with an NVIDIA GPU, small otherwise.
# Other values: tiny, base, small, medium, large-v3, large-v3-turbo, distil-large-v3
name = "auto"
device = "auto"          # auto | cuda | cpu
compute_type = "auto"    # auto | float16 | int8_float16 | int8
language = "fr"          # ISO 639-1 code, or "auto" for automatic detection
beam_size = 5
# Priming sentence given to the model (style, general context):
initial_prompt = ""
# Terms the model mangles — proper nouns, tools, jargon — separated by commas.
# They are pushed into the decoder for every sentence.
vocabulary = ""
# Feeds the end of what was just dictated back to the model: a sentence isolated
# by the as-you-go splitting gets its context back.
context = true
# Carries out the corrections you say aloud: "on Tuesday, no wait, on Wednesday"
# is written "on Wednesday" ("mardi, non, plutôt mercredi" -> "mercredi").
corrections = true
# Leaves the hesitations out of the text: "euh", "hum", "um", "uh" and the words you
# stumble over ("je je pense" -> "je pense", "we could, we could meet" -> "we could meet").
hesitations = true
# Writes the punctuation you say aloud: "virgule", "point", "point d'interrogation",
# "deux points", "à la ligne", "nouveau paragraphe", "ouvrez les guillemets", "fermez la
# parenthèse" ("comma", "period", "question mark", "colon", "new line", "new paragraph",
# "open quote", "close paren" in English).
spoken_punctuation = true
# Writes the names you say in a style: "camel case user name" -> userName, "pascal case
# payment service" -> PaymentService, "snake case created at" -> created_at, "kebab case
# user profile" -> user-profile, "constant case max retries" -> MAX_RETRIES.
developer_syntax = true
# Loads the model when the service starts: the first dictation is instant.
preload = true

[recording]
device = "default"              # capture device (arecord -L, pactl list sources)
# Capture tool. "auto" takes the first one available on the host:
# arecord (Linux), parec (WSLg), rec/sox then ffmpeg (macOS).
backend = "auto"
max_seconds = 120
# Dictation as you go: each sentence is transcribed and inserted as soon as you
# make a short pause, without interrupting listening.
streaming = true
segment_silence_seconds = 0.6   # pause that splits a sentence
silence_seconds = 2.0           # silence that ends the dictation; 0 = disabled
start_timeout_seconds = 8       # give up if nothing is said after the key press
threshold = "auto"              # "auto" or an integer (RMS 0-32767)

[output]
# cursor    : inserts the text where the cursor is (simulated paste)
# clipboard : merely copies it
# stdout    : writes it to the daemon's standard output
# Combinable with "+", e.g. "cursor+stdout".
mode = "cursor"
# Shortcut sent to the virtual keyboard to insert the text.
# "auto": cmd+v on macOS, shift+insert on Linux (it also pastes in a terminal,
# where Ctrl+V means something else), ctrl+v on WSL.
paste_shortcut = "auto"
# How that keystroke is sent. "auto" follows the host:
# uinput then mutter — GNOME's remote desktop API — (Linux), windows/SendKeys (WSL),
# applescript (macOS). "none" disables it.
keyboard = "auto"
# Hands your original clipboard back at the end of the dictation.
restore_clipboard = true
notify = false                  # a notification for every transcription
history = true                  # keeps every dictation: whisper-desk history
history_days = 0                # drops dictations older than this; 0 = kept forever

[overlay]
# Ignored if the system Python lacks PyGObject + GTK3 (common on macOS).
enabled = true
accent = "#e46212"
width = 232
height = 64
bars = 15                       # number of equalizer bars
position = "bottom-center"      # bottom-center | top-center | center
margin = 96                     # distance to the screen edge, in pixels


[snippets]
# A cue you say -> the text typed in its place, alone or inside a sentence.
# Also edited in the settings window: whisper-desk settings, Snippets.
# Case, punctuation and spacing do not matter; the longest cue wins.
# Pick cues you would not say otherwise ("mon adresse perso", not "merci").
# "mon adresse perso" = "12 rue des Lilas, 75011 Paris"
# "my calendar link" = "https://cal.com/me/30min"
# "ma signature" = """
# Bien à vous,
# Salvador"""
