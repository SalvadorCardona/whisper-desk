# Configuration de linux-whisper — ~/.config/linux-whisper/config.toml
# Après modification : linux-whisper reload

[hotkey]
# Syntaxe GTK : <Super>, <Ctrl>, <Alt>, <Shift>. Ex. "<Super><Shift>d", "<Ctrl><Alt>space".
binding = "<Super>j"
name = "linux-whisper"
# Appliquer un changement de raccourci : linux-whisper hotkey install
action = "toggle"

[model]
# "auto" : large-v3-turbo si GPU NVIDIA, sinon small.
# Autres valeurs : tiny, base, small, medium, large-v3, large-v3-turbo, distil-large-v3
name = "auto"
device = "auto"          # auto | cuda | cpu
compute_type = "auto"    # auto | float16 | int8_float16 | int8
language = "fr"          # code ISO 639-1, ou "auto" pour la détection automatique
beam_size = 5
# Vocabulaire à privilégier (noms propres, jargon) :
initial_prompt = ""
# Charge le modèle au démarrage du service : la première dictée est instantanée.
preload = true

[recording]
device = "default"              # périphérique ALSA (voir : arecord -L)
max_seconds = 120
# Dictée au fil de l'eau : chaque phrase est transcrite et insérée dès que vous
# marquez une petite pause, sans interrompre l'écoute.
streaming = true
segment_silence_seconds = 0.6   # pause qui découpe une phrase
silence_seconds = 2.0           # silence qui met fin à la dictée ; 0 = désactivé
start_timeout_seconds = 8       # abandon si rien n'est dit après l'appui
threshold = "auto"              # "auto" ou un entier (RMS 0-32767)

[output]
# cursor    : insère le texte là où est le curseur (collage simulé)
# clipboard : se contente de le copier
# stdout    : l'écrit sur la sortie standard du daemon
# Combinables avec « + », ex. "cursor+stdout".
mode = "cursor"
# Raccourci envoyé au clavier virtuel pour insérer le texte.
# "shift+insert" si vous dictez surtout dans un terminal (Ctrl+V y est autre chose).
paste_shortcut = "ctrl+v"
# Rend votre presse-papiers d'origine à la fin de la dictée.
restore_clipboard = true
notify = false                  # notification à chaque transcription
history = true                  # journal dans ~/.local/state/linux-whisper/history.log

[overlay]
enabled = true
accent = "#e46212"
width = 168
height = 64
position = "bottom-center"      # bottom-center | top-center | center
margin = 96                     # distance au bord de l'écran, en pixels
