# Configuration de whisper-desk — ~/.config/whisper-desk/config.toml
# Après modification : whisper-desk reload

[hotkey]
# Syntaxe GTK : <Super>, <Ctrl>, <Alt>, <Shift>. Ex. "<Super><Shift>d", "<Ctrl><Alt>space".
# "auto" : <Super>j — mais <Ctrl><Alt>j sous WSL, Windows se réservant la
# touche Windows et n'acceptant de raccourci global qu'en Ctrl+Alt.
binding = "auto"
name = "whisper-desk"
# Appliquer un changement de raccourci : whisper-desk hotkey install
action = "toggle"

[model]
# "auto" : large-v3-turbo si GPU NVIDIA, sinon small.
# Autres valeurs : tiny, base, small, medium, large-v3, large-v3-turbo, distil-large-v3
name = "auto"
device = "auto"          # auto | cuda | cpu
compute_type = "auto"    # auto | float16 | int8_float16 | int8
language = "fr"          # code ISO 639-1, ou "auto" pour la détection automatique
beam_size = 5
# Phrase d'amorce donnée au modèle (style, contexte général) :
initial_prompt = ""
# Termes que le modèle écorche — noms propres, outils, jargon — séparés par des
# virgules. Ils sont poussés dans le décodeur à chaque phrase.
vocabulary = ""
# Repasse au modèle la fin de ce qui vient d'être dicté : une phrase isolée par
# le découpage au fil de l'eau retrouve son contexte.
context = true
# Charge le modèle au démarrage du service : la première dictée est instantanée.
preload = true

[recording]
device = "default"              # périphérique de capture (arecord -L, pactl list sources)
# Outil de capture. "auto" prend le premier disponible sur l'hôte :
# arecord (Linux), parec (WSLg), rec/sox puis ffmpeg (macOS).
backend = "auto"
max_seconds = 120
# Dictée au fil de l'eau : chaque phrase est transcrite et insérée dès que vous
# marquez une petite pause, sans interrompre l'écoute.
streaming = true
segment_silence_seconds = 0.6   # pause qui découpe une phrase
silence_seconds = 2.0           # silence qui met fin à la dictée ; 0 = désactivé
start_timeout_seconds = 8       # abandon si rien n'est dit après l'appui
threshold = "auto"              # "auto" ou un entier (RMS 0-32767)

[output]
# cursor    : insère le texte là où est le curseur (collage simulé)
# clipboard : se contente de le copier
# stdout    : l'écrit sur la sortie standard du daemon
# Combinables avec « + », ex. "cursor+stdout".
mode = "cursor"
# Raccourci envoyé au clavier virtuel pour insérer le texte.
# "auto" : cmd+v sur macOS, ctrl+v ailleurs.
# "shift+insert" si vous dictez surtout dans un terminal (Ctrl+V y est autre chose).
paste_shortcut = "auto"
# Comment cette frappe est envoyée. "auto" suit l'hôte :
# uinput (Linux), windows/SendKeys (WSL), applescript (macOS). "none" désactive.
keyboard = "auto"
# Rend votre presse-papiers d'origine à la fin de la dictée.
restore_clipboard = true
notify = false                  # notification à chaque transcription
history = true                  # journal dans ~/.local/state/whisper-desk/history.log

[overlay]
# Ignoré si le Python système n'a pas PyGObject + GTK3 (cas courant sur macOS).
enabled = true
accent = "#e46212"
width = 232
height = 64
bars = 15                       # nombre de barres de l'equalizer
position = "bottom-center"      # bottom-center | top-center | center
margin = 96                     # distance au bord de l'écran, en pixels
