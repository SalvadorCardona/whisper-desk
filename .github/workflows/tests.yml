name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    # macOS is one of the supported hosts: the suite must pass there too.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite depends on the standard library alone: no venv, no faster-whisper.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Compile every module
        run: python -m compileall -q src
      - name: Syntax of the installation scripts
        run: sh -n install.sh && sh -n uninstall.sh
